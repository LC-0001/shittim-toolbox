<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shittim Toolbox · 什亭之匣</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#128AFA" id="browserThemeColor">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23128AFA'/%3E%3Cpath d='M8 10.5h16l-8 7.2-8-7.2z' fill='%23fff'/%3E%3Cpath d='M9 20.5h14' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ========== 变量池 ========== */
:root{
  --bg: #eef4fb;
  --bg-image: 
    radial-gradient(circle at 15% 30%, rgba(18, 138, 250, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.9) 0%, transparent 50%),
    linear-gradient(135deg, #eef4fb 0%, #d9e6f2 100%);
  --fg: #1d2a3a;
  --muted: #6a7a8d;
  --err: #d70015;
  --accent: #128AFA;
  --accent-fg: #ffffff;
  /* 聊天框和下拉通知的 CSS 玻璃（它们不挂 LiquidGlass） */
  --card-bg: rgba(255,255,255,.65);
  --card-border: rgba(255,255,255,.8);
  --card-shadow: 0 8px 24px rgba(18, 138, 250, .08), inset 0 1px 1px rgba(255,255,255,.9);
  --btn-radius: 4px;
  --btn-transform: skewX(-10deg);
  --placeholder: rgba(18, 138, 250, .4);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg: #141822;
    --bg-image: 
      radial-gradient(circle at 15% 30%, rgba(18, 138, 250, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
      linear-gradient(135deg, #141822 0%, #1a2233 100%);
    --fg: #e2e8f0;
    --muted: #8a9bb0;
    --err: #ff6b61;
    --accent: #128AFA;
    --accent-fg: #ffffff;
    --card-bg: rgba(30,34,42,.65);
    --card-border: rgba(255,255,255,.1);
    --card-shadow: 0 8px 24px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.08);
    --placeholder: rgba(138, 155, 176, .6);
  }
}

body.momotalk-theme {
  --bg: #fff0f4;
  --bg-image: 
    radial-gradient(circle at 80% 20%, rgba(255, 192, 210, 0.4) 0%, transparent 40%), 
    radial-gradient(circle at 20% 80%, rgba(255, 136, 170, 0.2) 0%, transparent 50%), 
    linear-gradient(135deg, #fff0f4 0%, #ffe0e8 100%);
  --fg: #333333;
  --muted: #999999;
  --err: #d70015;
  --accent: #FF88AA;
  --accent-fg: #ffffff;
  --card-bg: rgba(255,255,255,.72);
  --card-border: rgba(255,255,255,.85);
  --card-shadow: 0 10px 30px rgba(255,136,170,.15), inset 0 1px 1px rgba(255,255,255,1);
  --btn-radius: 12px;
  --btn-transform: none;
  --placeholder: rgba(153,153,153,.6);
}
@media (prefers-color-scheme:dark){
  body.momotalk-theme{
    --bg: #1a1a1a;
    --bg-image: 
      radial-gradient(circle at 80% 20%, rgba(255, 136, 170, 0.15) 0%, transparent 40%), 
      radial-gradient(circle at 20% 80%, rgba(255, 136, 170, 0.1) 0%, transparent 50%), 
      linear-gradient(135deg, #1a1a1a 0%, #2a2025 100%);
    --fg: #eeeeee;
    --muted: #999999;
    --err: #ff6b61;
    --accent: #FF88AA;
    --accent-fg: #ffffff;
    --card-bg: rgba(45,32,38,.7);
    --card-border: rgba(255,255,255,.08);
    --card-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.06);
    --placeholder: rgba(153,153,153,.6);
  }
}

/* ========== 基础 ========== */
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:color .4s ease;
}
html{background-color:var(--bg);overscroll-behavior-y:none}
main{position:relative;z-index:1}
body{
  min-height:100vh;min-height:100dvh;
  padding: env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);
  position:relative;
  background:transparent;
  overflow-x:clip;
}
.bg-layer{
  position:fixed;top:0;left:-1px;width:calc(100% + 2px);height:100vh;height:100lvh;z-index:0;pointer-events:none;
  transform:translate3d(0,0,0);will-change:transform;backface-visibility:hidden;
  background-color:var(--bg);
  background-image:var(--bg-image);
  background-size:cover;background-position:center;
}

/* ========== 布局 ========== */
main{
  flex:1;max-width:560px;margin:0 auto;
  padding:40px 0 80px;position:relative;z-index:1;
}
header{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:24px}
h1{
  font-size:24px;font-weight:400;letter-spacing:.05em;line-height:1.2;
  margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  transition:color .4s ease;
}
.back{display:none;width:36px;height:36px;padding:0;border:0;background:none;color:var(--fg);cursor:pointer;margin-left:-8px;transition:color .4s}
.back.show{display:block}
.back svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#aronaEntry{
  display:flex;width:34px;height:34px;border-radius:10px;background:var(--accent);
  box-shadow:0 4px 12px rgba(0,0,0,.15),inset 0 1px 1px rgba(255,255,255,.4);
  cursor:pointer;align-items:center;justify-content:center;position:relative;
  transition:transform .2s,background .4s;
}
#aronaEntry:active{transform:scale(.9)}
#aronaEntry.show{display:flex;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
#aronaEntry::after{
  content:'';position:absolute;top:-2px;right:-2px;width:8px;height:8px;
  background:#ff4d4f;border-radius:50%;border:2px solid var(--bg);display:none;
  transition:border-color .4s;
}
#aronaEntry.unread::after{display:block}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* ========== 纯正液态玻璃（不要 CSS 背景和模糊） ========== */
.glass{
  position:relative; isolation:isolate; border-radius:var(--r-panel,28px);
  box-shadow: var(--card-shadow);
  /* 关键：完全剔除 background 和 backdrop-filter，全权交由 JS 库绘制 */
}
.gin{
  border-radius:var(--r-in,12px);
}

/* ========== 首页 ========== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{
  display:block;padding:20px;border:0;color:var(--fg);font:inherit;
  text-align:left;cursor:pointer;
  animation:fade .6s ease both;animation-delay:calc(var(--i,0)*60ms);
  transition:color .4s,transform .2s;
}
.card:active{transform:scale(.98)}
.card .ico{display:block;width:26px;height:26px;margin-bottom:22px}
.card .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-size:18px;font-weight:400;margin-bottom:4px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;}
.card small{font-size:12px;color:var(--muted);line-height:1.4;transition:color .4s}

/* ========== 工具面板 ========== */
.panel{padding:16px;animation:fade .4s ease both}
.field{margin-bottom:14px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:0 4px 8px;transition:color .4s}

textarea,input.in{
  width:100%;display:block;border:0;outline:none;background:transparent;
  color:var(--fg);border-radius:12px;padding:12px 14px;font-size:15px;
  transition:color .4s;
}
input::placeholder,textarea::placeholder{color:var(--placeholder);opacity:1;transition:color .4s}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;min-height:120px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

.out{
  border-radius:12px;padding:12px 14px;min-height:48px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;
  word-break:break-all;white-space:pre-wrap;
  transition:color .4s;
}
.out.err,.err{color:var(--err)}

.seg{display:flex;gap:3px;padding:3px;border-radius:14px;margin-bottom:14px;background:rgba(127,127,127,.12)}
.seg button{
  flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
  padding:8px 10px;border-radius:11px;cursor:pointer;white-space:nowrap;
  transition:background .3s ease,color .4s ease;
}
.seg button.on{background:var(--accent);color:var(--accent-fg)}

.btn{
  border:0;color:var(--fg);font:inherit;font-size:14px;padding:10px 16px;
  border-radius:var(--btn-radius);cursor:pointer;background:rgba(127,127,127,.14);
  transition:all .25s ease;
  transform: var(--btn-transform);
}
body:not(.momotalk-theme) .btn { border: 1px solid var(--accent); color: var(--accent); font-weight: 600; background: rgba(255,255,255,0.4); }
body:not(.momotalk-theme):not(.has-bg) .btn:not(.primary){background:#2a3d55;border-color:#2a3d55;color:#fff;box-shadow:0 2px 8px rgba(20,40,70,.18)}
/* 默认主题：轨道也做斜切，和滑块同形 */
body:not(.momotalk-theme):not(.has-bg) .seg{background:transparent;box-shadow:none}
body:not(.momotalk-theme):not(.has-bg) .seg::before{content:'';position:absolute;inset:0;border-radius:8px;background:rgba(127,127,127,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transform:skewX(-10deg);pointer-events:none}
body:not(.momotalk-theme):not(.has-bg)[data-theme-mode="dark"] .seg::before{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){
  body:not(.momotalk-theme):not(.has-bg):not([data-theme-mode="light"]) .seg::before{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
}
body:not(.momotalk-theme) .btn.primary { background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 10px rgba(18, 138, 250, 0.3); }
@media (prefers-color-scheme:dark){
  body:not(.momotalk-theme):not(.has-bg) .btn:not(.primary){
    color:#78bdff;background:rgba(18,138,250,.16);border-color:rgba(91,177,255,.72);
  }
  body:not(.momotalk-theme):not(.has-bg) .chat-opt-btn{
    color:#8bc8ff;border-color:rgba(91,177,255,.58);background:rgba(18,138,250,.12);
  }
}
.btn:active{opacity:.8;transform:var(--btn-transform) scale(.96)}

.row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.pair{display:flex;gap:10px;align-items:center}
.pair input{flex:1}

.pick{
  position:relative;display:block;width:48px;height:48px;border:0;padding:0;
  border-radius:12px;background:none;cursor:pointer;flex:none;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(127,127,127,.3);
}
.pickFill{position:absolute;inset:0;border-radius:12px;background:#1d1d1f;transition:background .2s}

.res{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:12px 14px;cursor:pointer;border-radius:12px;margin-bottom:4px;
  background:rgba(127,127,127,.06);
  transition:background .2s ease;
}
.res:active{background:rgba(127,127,127,.18)}
.res span{color:var(--muted);font-size:13px;flex:none;transition:color .4s}
.res code{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;word-break:break-all;
  text-align:right;font-weight:600;
  background:var(--accent);color:var(--accent-fg);
  padding:4px 10px;border-radius:8px;
  transition:background .4s,color .4s;
}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px;transition:color .4s}
.stat strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;transition:color .4s}

#liveClock{
  font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;
  background:var(--accent);color:var(--accent-fg);
  transition:background .4s,color .4s;
}

#wtClear{
  position:absolute;right:12px;bottom:12px;height:30px;padding:0 14px;
  font-size:13px;font-weight:500;border-radius:10px;cursor:pointer;z-index:10;
  white-space:nowrap;background:rgba(255,255,255,.95);color:#111;
  border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 8px rgba(0,0,0,.08);
  width:56px;
  transition:width .3s cubic-bezier(.34,1.56,.64,1),background-color .3s ease,color .3s ease,opacity .2s ease,transform .2s ease;
  overflow:hidden;opacity:0;pointer-events:none;
}
#wtClear.confirming{background:#ff4d4f!important;color:#fff!important;width:86px}
#wtClear:active{transform:scale(.94)}

/* ========== 日期时间玻璃选择器 ========== */
.date-trigger{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;
  gap:10px;text-align:left;cursor:pointer;font:inherit;font-size:14px;
  border:0;padding:12px 14px;min-height:46px;
}
.date-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-trigger svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.8}
.date-sheet{z-index:90}
.date-card{max-width:370px}
.date-head{display:flex;align-items:center;justify-content:space-between}
.date-head .sheetTitle{margin-bottom:14px}
.date-close{border:0;background:rgba(127,127,127,.12);color:var(--fg);width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.calendar-top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.calendar-top strong{font-size:15px;font-weight:600;color:var(--fg)}
.date-nav{width:36px;height:36px;border:0;border-radius:12px;background:rgba(127,127,127,.12);color:var(--fg);font-size:24px;line-height:1;cursor:pointer}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-grid button{height:38px;border:0;border-radius:11px;background:transparent;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.calendar-grid .weekday{height:28px;color:var(--muted);font-size:11px;cursor:default}
.calendar-grid .empty{pointer-events:none}
.calendar-grid .day.selected{background:var(--accent);color:var(--accent-fg);font-weight:700}
.calendar-grid .day.today:not(.selected){box-shadow:inset 0 0 0 1px var(--accent)}
.date-time-row{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 16px}
.date-time-row .lbl{margin:0}
.time-fields{display:flex;align-items:center;gap:7px}
.time-fields label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.time-fields input{width:58px;height:40px;padding:7px;text-align:center;font-size:15px}
.time-fields b{color:var(--muted)}
.date-actions{display:flex;justify-content:flex-end;gap:8px}
@media(prefers-color-scheme:dark){.date-nav,.date-close{background:rgba(255,255,255,.09)}}

/* ========== 取色面板 ========== */
.sheet{
  position:fixed;inset:0;z-index:60;display:flex;padding:20px;overflow-y:auto;
  background:rgba(0,0,0,.35);
  /* 恢复纯遮罩，不加任何 backdrop-filter，防止手机端混合发黑 */
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.sheet.show{opacity:1;pointer-events:auto}
.sheetCard{
  width:100%;max-width:360px;margin:auto;padding:20px 18px 14px;border-radius:24px;
  transform:translateY(10px);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  will-change: transform, opacity;
  /* 绝对干净：移除一切 CSS background 和 backdrop-filter */
}
.sheet.show .sheetCard{transform:none}
.sheetTitle{font-size:22px;font-weight:400;margin:0 2px 16px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;transition:color .4s}

.swGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sw{
  aspect-ratio:1/1;border:0;padding:0;border-radius:12px;background:var(--c);
  cursor:pointer;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3);
}
.sw.on{box-shadow:0 0 0 2px var(--fg)}

.pickBlock{margin-bottom:14px}
.sv{
  position:relative;height:110px;border-radius:14px;touch-action:none;cursor:crosshair;
  background:linear-gradient(to top,#000,rgba(0,0,0,0)),
             linear-gradient(to right,#fff,var(--hue,#f00));
  box-shadow:inset 0 0 0 1px rgba(127,127,127,.28);
}
.sv:focus-visible,.hue:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.svKnob{
  position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.4);pointer-events:none;
}
.hue{
  position:relative;height:22px;border-radius:11px;margin-top:14px;touch-action:none;cursor:pointer;
  background:linear-gradient(to right,#f00,#ff0 16.6%,#0f0 33.3%,#0ff 50%,#00f 66.6%,#f0f 83.3%,#f00);
  box-shadow:inset 0 0 0 1px rgba(127,127,127,.28);
}
.hueKnob{
  position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.4);pointer-events:none;
}
.chosen{display:flex;align-items:center;gap:10px;margin:16px 0 14px}
.chosenSw{width:32px;height:32px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.chosenHex{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--muted);transition:color .4s}
.acts{display:flex;gap:8px;justify-content:flex-end}

/* ========== 版本彩蛋 & 通知 ========== */
.version-egg{
  text-align:center;padding:20px 0 calc(10px + env(safe-area-inset-bottom,0px));
  color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:1px;cursor:pointer;
  transition:color .4s ease,transform .3s;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:100%;
}
.version-egg:active{transform:scale(.95)}

.egg-notif{
  position:fixed;top:-120px;left:50%;transform:translateX(-50%);
  width:calc(100% - 40px);max-width:400px;padding:14px 16px;border-radius:20px;
  display:flex;gap:12px;align-items:center;z-index:9999;
  background:var(--card-bg);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--card-shadow);
  border:1px solid var(--card-border);
  transition:top .6s cubic-bezier(.34,1.56,.64,1),opacity .4s ease,background .4s,border-color .4s;
  opacity:0;pointer-events:none;
}
.egg-notif.show{top:calc(20px + env(safe-area-inset-top,0px));opacity:1;pointer-events:auto}
.egg-notif-icon{
  width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .4s;
}
.egg-notif-body{flex:1;min-width:0}
.egg-notif-head{display:flex;align-items:baseline;gap:8px}
.egg-notif-time{font-size:11px;color:var(--muted);margin-left:auto;flex:none}
.egg-notif-title{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:3px;transition:color .4s}
.egg-notif-text{font-size:13px;color:var(--muted);line-height:1.4;transition:color .4s}

/* ========== 聊天 ========== */
.chat-ui{
  position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;
  background-color: var(--bg);
  background-image: var(--bg-image);
  background-size: cover;
  transform:translateY(100%);opacity:0;pointer-events:none;
  transition:transform .4s cubic-bezier(.25,1,.5,1),opacity .4s ease,color .3s;
}
.chat-ui.show{transform:translateY(0);opacity:1;pointer-events:auto}

.chat-header{
  position:relative;z-index:1;display:flex;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  opacity:0;transform:translateY(-5px);
  transition:opacity .3s ease,transform .3s ease;
}
.chat-ui.show .chat-header{opacity:1;transform:none;transition-delay:.15s}
.chat-back{
  background:none;border:none;font-size:20px;color:var(--fg);
  cursor:pointer;padding:0 10px 0 0;transition:color .4s;
}
.chat-title{flex:1;font-size:18px;font-weight:600;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;transition:color .4s}

.chat-character-tabs{position:relative;z-index:1;display:flex;gap:8px;padding:8px 16px 0;opacity:0;transition:opacity .3s ease}
.chat-ui.show .chat-character-tabs{opacity:1;transition-delay:.12s}
.chat-character-tab{flex:1;min-height:36px;border:1px solid var(--card-border);border-radius:12px;background:var(--card-bg);color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.chat-character-tab.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card-bg));font-weight:700}
.chat-msg.plana{align-self:flex-start;background:rgba(143,132,205,.14);color:var(--fg);border:1px solid rgba(143,132,205,.28);box-shadow:var(--card-shadow)}
.chat-name.plana{color:#9a8bd1}
.chat-body{
  position:relative;z-index:1;flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;gap:16px;
}
.chat-msg{
  max-width:80%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.5;
  animation:msgIn .3s ease both;
  transition:background .4s,border .4s,color .4s;
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chat-msg.arona{
  align-self:flex-start;background:var(--card-bg);color:var(--fg);
  box-shadow:var(--card-shadow);
  border:1px solid var(--card-border);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
}
.chat-msg.user{
  align-self:flex-end;background:var(--accent);color:var(--accent-fg);
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.chat-options{
  display:flex;flex-direction:column;gap:8px;
}
.chat-options[hidden]{display:none!important}
.chat-options-popover{
  position:absolute;left:16px;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:5;
  display:flex;flex-direction:column;gap:8px;max-height:min(48dvh,360px);overflow-y:auto;overscroll-behavior:contain;
  padding:10px;border:1px solid var(--card-border);border-radius:18px;background:var(--card-bg);box-shadow:var(--card-shadow);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  transform-origin:bottom center;opacity:0;transform:translateY(10px) scale(.97);
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1);
}
.chat-options-popover.open{opacity:1;transform:translateY(0) scale(1)}
.chat-options-popover .chat-opt-btn{
  background:var(--card-bg);border:1px solid var(--card-border);
  box-shadow:var(--card-shadow);
  padding:12px;border-radius:var(--btn-radius);font-size:14px;color:var(--fg);
  text-align:left;cursor:pointer;
  opacity:0;transform:translateY(5px);
  transition:opacity .3s ease,transform .3s ease,color .4s,border-color .4s,background .4s;
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  transform: var(--btn-transform);
}
.chat-options-popover .chat-opt-btn{opacity:1;transform:var(--btn-transform)}
.chat-opt-btn:active{opacity:.8;transform:var(--btn-transform) scale(.98)}
body:not(.momotalk-theme) .chat-opt-btn { color: var(--accent); font-weight: 600; border-color: var(--accent); }
.chat-options{position:relative;z-index:4;padding:10px 16px calc(16px + env(safe-area-inset-bottom));}
.chat-preset-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border:1px solid var(--card-border);border-radius:14px;background:var(--card-bg);color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--card-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.chat-preset-toggle:active{transform:scale(.985)}
.preset-chevron{font-size:18px;line-height:12px;transition:transform .2s ease}
.chat-preset-toggle[aria-expanded="true"] .preset-chevron{transform:rotate(180deg)}
.chat-settings-btn{width:32px;height:32px;flex:none;border:1px solid var(--card-border);border-radius:10px;background:var(--card-bg);color:var(--fg);font-size:17px;cursor:pointer}


/* ========== 设计令牌：两套主题只换"形状语言"，结构一致 ========== */
:root{--r-panel:24px;--r-in:12px}
.gin,textarea.gin,input.in.gin,.out.gin{border-radius:var(--r-in)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea:focus-visible,input.in:focus-visible{outline-offset:-2px}
.btn{min-height:44px}
.seg button{min-height:40px}
.seg.sm button{font-size:12.5px;padding:8px 2px}

/* BA 经典：斜切标题条 + 极淡斜纹（只在这里放一点个性） */
body:not(.momotalk-theme)::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(-45deg,rgba(18,138,250,.04) 0 2px,transparent 2px 16px);
}
body:not(.momotalk-theme) h1{position:relative;padding-left:14px}
body:not(.momotalk-theme) h1::before{
  content:'';position:absolute;left:0;top:.18em;bottom:.18em;width:5px;
  background:var(--accent);transform:skewX(-10deg);
}

/* 没有 LiquidGlass 时（脚本加载失败）退回普通毛玻璃，避免卡片"消失" */
.no-lg .glass{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(16px) saturate(190%);-webkit-backdrop-filter:blur(16px) saturate(190%);box-shadow:var(--card-shadow),inset 0 1px 0 rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){.no-lg .glass{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-color:rgba(255,255,255,.14)}}
@media (prefers-color-scheme:dark){
  #wtClear{background:rgba(40,46,58,.95);color:#e2e8f0;border-color:rgba(255,255,255,.1)}
}

/* 聊天：头像 + 名字 + 输入中 */
.egg-notif{cursor:pointer}
.chat-row{display:flex;gap:10px;align-items:flex-start;animation:msgIn .3s ease both}
.chat-row.user{flex-direction:row-reverse}
.chat-col{display:flex;flex-direction:column;gap:4px;max-width:78%;min-width:0}
.chat-row.user .chat-col{align-items:flex-end}
.chat-row .chat-msg{max-width:none;animation:none}
.chat-name{font-size:12px;color:var(--muted);margin-left:2px}
.dots{display:flex;gap:5px;align-items:center;padding:15px 16px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}

/* 图片转 Base64 */
.drop{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:30px 16px;margin-bottom:14px;border:1.5px dashed var(--accent);
  background:transparent;color:var(--fg);font:inherit;text-align:center;cursor:pointer;
  transition:background .2s,transform .2s;
}
.drop.over{background:rgba(127,127,127,.14)}
.drop:active{transform:scale(.99)}
.drop svg{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-weight:500;font-size:16px}
.drop small{color:var(--muted);font-size:12px}
.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:0 4px 12px}
.hint:empty{display:none}
.thumb{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.tp{
  width:84px;height:84px;flex:none;overflow:hidden;border-radius:var(--r-in);
  background:repeating-conic-gradient(rgba(127,127,127,.22) 0 25%,transparent 0 50%) 0 0/16px 16px;
  box-shadow:inset 0 0 0 1px rgba(127,127,127,.3);
}
.tp img{display:block;width:100%;height:100%;object-fit:contain}
.tm{min-width:0;font-size:13px;line-height:1.6;color:var(--muted)}
.tm strong{display:block;color:var(--fg);font-weight:600;word-break:break-all}

/* ---- 第二轮修正 ---- */
*{-webkit-tap-highlight-color:rgba(0,0,0,0)}
.panel{padding:18px}
.field{margin-bottom:16px}
.row{margin-top:8px;gap:10px}
.thumb{margin-bottom:18px}

/* 清空按钮：之前被 .btn 的最小高度撑大了 */
#wtClear{min-height:0;height:28px;padding:0 12px;font-size:12px;width:52px;border-radius:9px}
#wtClear.confirming{width:80px}

/* 分段控件：更松的间距 + 滑块 */
.seg{position:relative;gap:4px;padding:4px;margin-bottom:16px;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.seg button{position:relative;z-index:1;padding:10px 8px}
.seg button.on{background:transparent}
.seg.sm button{font-size:13px;padding:10px 4px}
.seg-thumb{
  position:absolute;top:4px;bottom:4px;left:0;width:0;z-index:0;pointer-events:none;
  border-radius:10px;background:var(--accent);
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent);
  transform:translateX(var(--x,0px)) skewX(var(--sk,0deg));
}
.seg-thumb.anim{transition:transform .32s cubic-bezier(.3,1.25,.5,1),width .32s ease}
body:not(.momotalk-theme) .seg-thumb{--sk:-10deg;border-radius:6px}

@media (prefers-color-scheme:dark){.seg{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}}
.res{background:rgba(255,255,255,.2)}
@media (prefers-color-scheme:dark){.res{background:rgba(255,255,255,.06)}}

/* 背景加上有颜色的光斑，玻璃才有东西可折射，不会像一块实心板 */
:root{--bg-image:radial-gradient(circle at 12% 12%,rgba(18,138,250,.38) 0,transparent 36%),radial-gradient(circle at 90% 35%,rgba(120,150,255,.26) 0,transparent 34%),radial-gradient(circle at 25% 92%,rgba(18,138,250,.26) 0,transparent 40%),linear-gradient(135deg,#eef4fb,#d3e4f5)}
body.momotalk-theme{--bg-image:radial-gradient(circle at 12% 12%,rgba(255,136,170,.4) 0,transparent 36%),radial-gradient(circle at 90% 35%,rgba(255,190,210,.45) 0,transparent 34%),radial-gradient(circle at 25% 92%,rgba(255,120,160,.25) 0,transparent 40%),linear-gradient(135deg,#fff0f4,#ffe0e8)}
@media (prefers-color-scheme:dark){
  :root{--bg-image:radial-gradient(circle at 12% 12%,rgba(18,138,250,.3) 0,transparent 36%),radial-gradient(circle at 90% 35%,rgba(60,190,255,.18) 0,transparent 34%),radial-gradient(circle at 25% 92%,rgba(18,138,250,.22) 0,transparent 40%),linear-gradient(135deg,#141822,#1a2233)}
  body.momotalk-theme{--bg-image:radial-gradient(circle at 12% 12%,rgba(255,136,170,.25) 0,transparent 36%),radial-gradient(circle at 90% 35%,rgba(255,136,170,.15) 0,transparent 34%),radial-gradient(circle at 25% 92%,rgba(255,136,170,.18) 0,transparent 40%),linear-gradient(135deg,#1a1a1a,#2a2025)}
}

/* 取色弹窗"黑一下"的原因：.sheet 自身在做 opacity 动画，会成为 backdrop-filter 的“背景根”，
   玻璃只能看到里面的黑色遮罩改成：容器不动透明度，遮罩和卡片各自淡入 */
.sheet{background:none;opacity:1;visibility:hidden;transition:visibility 0s .28s}
.sheet.show{visibility:visible;transition-delay:0s}
.sheet::before{content:'';position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.28);opacity:0;transition:opacity .25s ease}
.sheet.show::before{opacity:1}
.sheetCard{opacity:0;transform:translateY(14px);transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .25s ease}
.sheet.show .sheetCard{opacity:1;transform:none}
.no-trans *,.no-trans *::before,.no-trans *::after{transition:none!important}
/* 聊天气泡：统一圆角长方形 */
.chat-msg{border-radius:18px}
/* 聊天页同理：用 visibility 代替整页透明度 */
.chat-ui{opacity:1;visibility:hidden;transition:transform .4s cubic-bezier(.25,1,.5,1),visibility 0s .4s,color .3s}
.chat-ui.show{visibility:visible;transition-delay:0s}

/* 输入框 / 结果区：凹槽 */
.gin{background:rgba(70,95,135,.11);box-shadow:inset 0 0 0 1px rgba(70,95,135,.22),inset 0 2px 5px rgba(70,95,135,.12)}
@media (prefers-color-scheme:dark){.gin{background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 2px 5px rgba(0,0,0,.3)}}
.drop.gin{background:transparent;box-shadow:none}
.drop.gin.over{background:rgba(127,127,127,.14)}
@media (prefers-color-scheme:light){:root{--placeholder:rgba(40,80,130,.5)}}
/* 自定义背景 */
body.has-bg{--bg-image:linear-gradient(var(--bg-scrim),var(--bg-scrim)),var(--custom-bg);--bg-scrim:rgba(255,255,255,.14);background-size:cover;background-position:center}
@media (prefers-color-scheme:dark){body.has-bg{--bg-scrim:rgba(0,0,0,.34)}}
body.has-bg::before{display:none}
body.has-bg .chat-ui{background-position:center}
/* 裁剪层：自带一套黑白配色（浅色=白底黑字，深色=黑底白字），不碰应用主题，所以不会闪 */
.crop-ui{--m-bg:#fff;--m-fg:#111;--m-line:rgba(0,0,0,.14);position:fixed;inset:0;z-index:150;background:#000;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none}
@media (prefers-color-scheme:dark){.crop-ui{--m-bg:#111;--m-fg:#fff;--m-line:rgba(255,255,255,.22)}}
.crop-stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.crop-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;will-change:transform;pointer-events:none}
.crop-bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:12px;padding:28px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.5))}
.crop-tip{margin:0;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.crop-acts{display:flex;gap:10px}
.crop-btn{flex:1;min-height:46px;border:1px solid var(--m-line);border-radius:12px;background:var(--m-bg);color:var(--m-fg);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.crop-btn:active{opacity:.8}
.crop-ok{background:var(--m-fg);color:var(--m-bg);border-color:var(--m-fg)}

/* ===== 简约黑白（自定义背景时全局生效）：黑字/白字、黑底/白底按钮、统一圆角，花哨留给用户的背景 ===== */
body.has-bg{
  --fg:#111;--muted:#4a5260;--accent:#111;--accent-fg:#fff;--err:#c4001a;
  --btn-radius:12px;--btn-transform:none;--placeholder:rgba(0,0,0,.45);
  --btn2-bg:#fff;--btn2-line:rgba(0,0,0,.22);
  --glass-fill:rgba(255,255,255,.6);--halo:rgba(255,255,255,.9);
  --card-bg:rgba(255,255,255,.72);--card-border:rgba(255,255,255,.7);
  --card-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.6);
}
body.has-bg[data-theme-mode="dark"]{
  --fg:#f5f6f8;--muted:#b9bfca;--accent:#fff;--accent-fg:#111;--err:#ff8a80;--placeholder:rgba(255,255,255,.5);
  --btn2-bg:#111;--btn2-line:rgba(255,255,255,.28);
  --glass-fill:rgba(16,18,24,.6);--halo:rgba(0,0,0,.9);
  --card-bg:rgba(20,22,28,.7);--card-border:rgba(255,255,255,.16);
  --card-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.1);
  --bg-scrim:rgba(0,0,0,.34);
}
@media (prefers-color-scheme:dark){
  body.has-bg:not([data-theme-mode="light"]){
    --fg:#f5f6f8;--muted:#b9bfca;--accent:#fff;--accent-fg:#111;--err:#ff8a80;--placeholder:rgba(255,255,255,.5);
    --btn2-bg:#111;--btn2-line:rgba(255,255,255,.28);
    --glass-fill:rgba(16,18,24,.6);--halo:rgba(0,0,0,.9);
    --card-bg:rgba(20,22,28,.7);--card-border:rgba(255,255,255,.16);
    --card-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.1);
    --bg-scrim:rgba(0,0,0,.34);
  }
}
body.has-bg .glass{background:var(--glass-fill)}
body.has-bg header{padding:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body.has-bg h1{padding-left:0}
body.has-bg h1::before{display:none}
body.has-bg .version-egg{color:var(--fg);text-shadow:0 0 8px var(--halo),0 0 3px var(--halo)}
body.has-bg .btn{transform:none;border-radius:12px;border:1px solid var(--btn2-line);background:var(--btn2-bg);color:var(--fg);font-weight:600;box-shadow:none}
body.has-bg .btn.primary{box-shadow:none!important}
body.has-bg .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
body.has-bg .btn:active{transform:scale(.97)}
body.has-bg .seg-thumb{--sk:0deg;border-radius:10px;box-shadow:none}
body.has-bg .gin{background:rgba(0,0,0,.06);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16),inset 0 2px 5px rgba(0,0,0,.08)}
body.has-bg #aronaEntry svg,body.has-bg .egg-notif-icon svg{stroke:var(--accent-fg)}
body.has-bg .chat-opt-btn{border-radius:12px;transform:none}
body.has-bg .chat-options-popover .chat-opt-btn{transform:none}
@media (prefers-color-scheme:dark){
  body.has-bg .gin{background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 2px 5px rgba(0,0,0,.3)}
}

/* ========== 公开设置入口与管理面板 ========== */
#settingsEntry{
  width:34px;height:34px;flex:none;border:1px solid rgba(127,127,127,.24);border-radius:10px;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  color:var(--fg);background:rgba(127,127,127,.10);transition:background .2s,color .4s,transform .2s;
}
#settingsEntry:active{transform:scale(.92)}
#settingsEntry svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.settings-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s,visibility .22s}
.settings-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
.settings-card{width:100%;max-width:440px;max-height:min(82dvh,720px);overflow:auto;padding:22px;border-radius:24px;color:var(--fg);background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--card-shadow);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);transform:translateY(8px);transition:transform .22s,background .4s,color .4s}
.settings-overlay.show .settings-card{transform:none}
.settings-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.settings-head h2{font-size:20px;font-weight:500;margin:0;flex:1}
.settings-close{width:32px;height:32px;border:0;border-radius:50%;font-size:22px;color:var(--fg);background:rgba(127,127,127,.14);cursor:pointer}
.settings-section{padding:14px 0;border-top:1px solid var(--card-border)}
.settings-section h3{font-size:14px;font-weight:600;margin:0 0 7px}
.settings-section p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 10px}
.settings-actions{display:flex;gap:8px;flex-wrap:wrap}
.settings-status{min-height:18px;margin-top:8px!important;color:var(--accent)!important}
@media(min-width:760px){
  body{padding-left:32px;padding-right:32px}
  main{max-width:960px;padding-top:56px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .card{padding:24px;min-height:154px}
  .card .ico{margin-bottom:24px}
  .panel{padding:24px}
  #view>.glass.panel{max-width:760px;margin:0 auto}
  header{margin-bottom:30px}
}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ========== 动画 / 可访问性 ========== */
@keyframes fade{from{opacity:0}to{opacity:1}}
::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}
*{scrollbar-width:none!important;-ms-overflow-style:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================================================
   2.0 改版：合并对话框、想说的话面板、首次访问通知
   ============================================================ */

/* 返回键：宽开口的 "<"，不用箭头 */
.back{width:44px;height:44px;display:none;place-items:center;margin-left:-10px;border-radius:12px}
.back.show{display:grid}
.back svg{width:22px;height:22px;stroke-width:2.2}

/* ===================== 编码 ===================== */
const enc = new TextEncoder();
const dec = new TextDecoder('utf-8', { fatal: true });
function bytesToHex(b){ return Array.from(b, x => x.toString(16).padStart(2,'0').toUpperCase()).join(' '); }
function hexToBytes(s){
  const h = s.replace(/\s+/g,'');
  if (!/^[0-9a-fA-F]*$/.test(h)) throw new Error('含有非十六进制字符');
  if (h.length % 2) throw new Error('十六进制位数必须为偶数');
  return Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
}
function bytesToB64(b){ let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b64ToBytes(s){
  let t = s.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');   // 兼容 URL-safe 与缺失的 =
  t += '='.repeat((4 - t.length % 4) % 4);
  return Uint8Array.from(atob(t), c => c.charCodeAt(0));
}
function friendlyErr(e){
  if (e && e.name === 'InvalidCharacterError') return 'Base64 内容不合法';
  if (e instanceof URIError) return 'URL 编码不完整，或含有非法的 % 序列';
  if (e instanceof TypeError) return '解码结果不是有效的 UTF-8 文本';
  return (e && e.message) || String(e);
}

/* ===================== 工具2：进制转换 ===================== */
const DIG = '0123456789abcdefghijklmnopqrstuvwxyz';
function parseBase(s, b){
  s = s.trim().replace(/\s+/g,'').toLowerCase();
  if (!s) return null;
  let neg = false;
  if (s[0] === '-'){ neg = true; s = s.slice(1); }
  else if (s[0] === '+'){ s = s.slice(1); }
  if (!s) return null;
  const B = BigInt(b);
  let n = 0n;
  for (const c of s){
    const d = DIG.indexOf(c);
    if (d < 0 || d >= b) throw new Error(`"${c}" 不是合法的 ${b} 进制数字`);
    n = n * B + BigInt(d);
  }
  return neg ? -n : n;
}

/* ===================== 取色面板 ===================== */
const sheet = $('#sheet'), sheetCard = $('#sheetCard');

const swGrid = $('#swGrid'), chosenSw = $('#chosenSw'), chosenHex = $('#chosenHex');
const PRESETS = ['#ff0000','#00ffff','#0000ff','#00ff00','#ff00ff','#ffff00','#000000','#ffffff'];

let pkLastFocus = null;

/* 弹窗恢复挂载 LiquidGlass，不再使用任何 CSS 补丁 */
glass(sheetCard, PANEL);

function hsvToRgb(h, s, v){
  h = ((h % 360) + 360) % 360;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60){ r = c; g = x; }
  else if (h < 120){ r = x; g = c; }
  else if (h < 180){ g = c; b = x; }
  else if (h < 240){ g = x; b = c; }
  else if (h < 300){ r = x; b = c; }
  else { r = c; b = x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHsv(r, g, b){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  const s = mx ? d / mx : 0, v = mx;
  if (d){
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return { h, s, v };
}
function pkHex(){
  const [r, g, b] = hsvToRgb(pk.h, pk.s, pk.v);
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}
function paint(){

});
function drag(node, fn){
  let on = false;
  const move = e => {
    if (!on) return;
    const r = node.getBoundingClientRect();
    fn(
      Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
    );
  };
  node.addEventListener('pointerdown', e => {
    on = true;
    try{ node.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
    move(e);
  });
  node.addEventListener('pointermove', move);
  node.addEventListener('pointerup', () => { on = false; });
  node.addEventListener('pointercancel', () => { on = false; });
}
drag(svArea, (x, y) => { pk.s = x; pk.v = 1 - y; paint(); });
drag(hueBar, x => { pk.h = x * 360; paint(); });

svArea.addEventListener('keydown', e => {
  const step = e.shiftKey ? .1 : .02;
  if (e.key === 'ArrowLeft'){ pk.s = Math.max(0, pk.s - step); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ pk.s = Math.min(1, pk.s + step); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowUp'){ pk.v = Math.min(1, pk.v + step); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ pk.v = Math.max(0, pk.v - step); paint(); e.preventDefault(); }
});
hueBar.addEventListener('keydown', e => {
  const step = e.shiftKey ? 30 : 5;
  if (e.key === 'ArrowLeft'){ pk.h = (pk.h - step + 360) % 360; paint(); e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ pk.h = (pk.h + step) % 360; paint(); e.preventDefault(); }
});

/* ===================== 工具4：颜色转换 ===================== */
function hexToRgb(hex){ const s = hex.slice(1); return [0,2,4].map(i => parseInt(s.slice(i, i+2), 16)); }
function rgbToHsl(r, g, b){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
  const l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d){
    s = d / (1 - Math.abs(2 * l - 1));
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}

const IMG_MAX = 1024 * 1024;   // 1 MB：再大的 Base64 在手机上复制 / 粘贴都会卡
const EXT_MIME = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml', avif:'image/avif', bmp:'image/bmp', ico:'image/x-icon' };

function imageTool(r){

      <div class="field"><div class="out" data-g="in" id="imgOut"></div></div>

  function fail(t){ msg.className = 'hint err'; msg.textContent = t; }
  function value(){
    const uri = `data:${info.mime};base64,${info.b64}`;

  }

  }
  function meta(){
    const label = info.mime.split('/')[1].replace('svg+xml', 'svg').replace('x-icon', 'ico').replace('vnd.microsoft.icon', 'ico').toUpperCase();
    tm.replaceChildren(

  }
  function load(f){
    msg.className = 'hint'; msg.textContent = '';
    const ext = (f.name.split('.').pop() || '').toLowerCase();

}

function applyMomoTheme(){
  const on = localStorage.getItem(MOMO_KEY) === 'true';
  if (document.body.classList.contains('momotalk-theme') === on) return;
  const root = document.documentElement;
  root.classList.add('no-trans');
  document.body.classList.toggle('momotalk-theme', on);
  void root.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('no-trans')));
}
function updateBrowserThemeColor(){
  const meta=document.getElementById('browserThemeColor');
  if(!meta)return;
  const mode=document.body.getAttribute('data-theme-mode');
  const dark=mode==='dark'||(mode!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  const custom=document.body.classList.contains('has-bg');
  const momo=document.body.classList.contains('momotalk-theme');
  meta.setAttribute('content', custom ? (dark ? '#000000' : '#ffffff') : (dark ? '#000000' : (momo ? '#FF88AA' : '#128AFA')));
}
const themeMedia=window.matchMedia('(prefers-color-scheme: dark)');
if(themeMedia.addEventListener) themeMedia.addEventListener('change',updateBrowserThemeColor);
else if(themeMedia.addListener) themeMedia.addListener(updateBrowserThemeColor);

(function pinBackground(){
  const layer = document.querySelector('.bg-layer');
  if (!layer) return;
  let raf = 0, broken = false;
  function check(){
    raf = 0;
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    const top = layer.getBoundingClientRect().top;
    if (!broken && Math.abs(top) > 24) broken = true;
    if (broken) layer.style.transform = `translate3d(0,${y}px,0)`;
  }
  window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(check); }, { passive:true });
})();

function loadChatHistory(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(K.history) || 'null'); }catch(_){}
  if (!Array.isArray(saved)){
    const merged = [];
    try{
      const a = JSON.parse(localStorage.getItem('momotalk_arona_history') || '[]');
      if (Array.isArray(a)) merged.push(...a);
    }catch(_){}
    try{
      const p = JSON.parse(localStorage.getItem('momotalk_plana_history') || '[]');
      if (Array.isArray(p)) merged.push(...p);
    }catch(_){}
    saved = merged.filter(m => m && typeof m.text === 'string').slice(-40);
    try{ localStorage.setItem(K.history, JSON.stringify(saved)); }catch(_){}
  }
  chatHistory = saved;
  chatStage = parseInt(localStorage.getItem(K.stage) || localStorage.getItem(K.oldStage) || '0', 10) || 0;
  try{ localStorage.setItem(K.stage, String(chatStage)); }catch(_){}
}

}

/* 两人连续回答：先阿罗娜，后普拉娜 */
function replyLines(lines, then){
  const list = (lines || []).filter(Boolean);
  if (!list.length){ if (then) then(); return; }
  let i = 0;
  (function next(){
    if (i >= list.length){ if (then) then(); return; }
    const m = list[i++];
    showTyping(m.role);
    setTimeout(() => {
      addMsg(m.role, m.text);
      setTimeout(next, m.role === 'plana' ? 260 : 420);
    }, i === 1 ? 620 : 460);
  })();
}

function unlockProtocol(){
  if (localStorage.getItem(K.unlocked) === 'true') return false;
  try{ localStorage.setItem(K.unlocked, 'true'); }catch(_){}
  return true;
}

function chooseOption(opt){
  if (busy) return;
  busy = true;
  closePanel();
  addMsg('user', opt.say);
  const firstTime = unlockProtocol();

  // 文件选择必须留在用户点击的同一个事件里
  if (opt.act === 'pickBg'){ bgInput.value = ''; bgInput.click(); }
  if (opt.act === 'import'){ importFile.value = ''; importFile.click(); }
  let exported = null;
  if (opt.act === 'export') exported = exportBackup();

  setTimeout(() => {
    const lines = opt.lines || (opt.reply ? [
      { role:'arona', text:opt.reply.arona },
      { role:'plana', text:opt.reply.plana }
    ] : []);
    replyLines(lines, () => {
      if (firstTime) addSystem('隐藏协议已激活 · 工具箱里其他角落的彩蛋可以触发了');
      if (opt.mode) setThemeMode(opt.mode);
      if (opt.act === 'resetBg') resetBgNow();
      if (opt.momo != null && isMomo() !== opt.momo){ toggleMomo(); refreshPanel(); }
      if (opt.act === 'export') addSystem(exported ? '备份文件已生成' : '备份生成失败，浏览器没能写入文件');
      if (opt.next != null){ chatStage = opt.next; saveStage(); }
      if (opt.group){ activeGroup = opt.group; setTimeout(openPanel, 400); }
      busy = false;
      initEggState();
    });
  }, 120);
}

/* 面板拖拽：高度可自由调节，下拉到底收起 */
(function initPanelDrag(){
  const grip = panelCard.querySelector('.panel-grip');
  if (!grip) return;
  let startY = 0, startH = 0, dragging = false, lastY = 0, lastT = 0, vy = 0, curH = 0, hitMax = false, hitMin = false;
  const minH = 200;
  const maxH = () => Math.min(innerHeight * 0.88, 660);
  grip.addEventListener('pointerdown', e => {
    if (!presetSheet.classList.contains('show')) return;
    dragging = true;
    startY = e.clientY; startH = panelCard.getBoundingClientRect().height;
    lastY = e.clientY; lastT = Date.now(); vy = 0; hitMax = hitMin = false;
    panelCard.style.transition = 'none';
    panelCard.style.height = startH + 'px'; panelCard.style.maxHeight = 'none';
    try { grip.setPointerCapture(e.pointerId); } catch(_){}
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = Date.now();
    vy = (e.clientY - lastY) / Math.max(1, now - lastT);
    lastY = e.clientY; lastT = now;
    let h = startH + (startY - e.clientY);
    if (h > maxH()){ h = maxH(); if (!hitMax){ hitMax = true; if (navigator.vibrate) navigator.vibrate(6); } }
    if (h < 120){ h = 120; if (!hitMin){ hitMin = true; if (navigator.vibrate) navigator.vibrate(6); } }
    curH = h;
    panelCard.style.height = h + 'px';
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    panelCard.style.transition = 'height .22s cubic-bezier(.22,.9,.28,1)';
    if (curH <= 140){
      if (navigator.vibrate) navigator.vibrate(10);
      closePanel();
      return;
    }
    const target = Math.max(minH, Math.min(curH, maxH()));
    panelCard.style.height = target + 'px';
    try { localStorage.setItem('shittim_panel_height', String(Math.round(target))); } catch(_){}
    if (navigator.vibrate) navigator.vibrate(5);
  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
})();
panelScrim.addEventListener('click', closePanel);

function setBgStyle(data){

const BG_MAX_BYTES = 8 * 1024 * 1024, BG_MAX_SIDE = 8000;
async function sniffImage(f){
  const b = new Uint8Array(await f.slice(0, 65536).arrayBuffer());
  const has = (str, from = 0) => {
    for (let i = from; i <= b.length - str.length; i++){
      let k = 0; while (k < str.length && b[i + k] === str.charCodeAt(k)) k++;
      if (k === str.length) return i;
    }
    return -1;
  };
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'anim';
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47){
    const a = has('acTL'), d = has('IDAT');
    return a >= 0 && (d < 0 || a < d) ? 'anim' : 'ok';
  }
  if (has('RIFF') === 0 && has('WEBP', 8) === 8)
    return (has('ANIM') >= 0 || (has('VP8X') === 12 && (b[20] & 2))) ? 'anim' : 'ok';
  if (b[0] === 0xFF && b[1] === 0xD8) return 'ok';
  return 'bad';
}
bgInput.addEventListener('change', async () => {
  const f = bgInput.files[0]; bgInput.value = '';
  if (!f) return;
  const say = t => { addMsg('arona', t); refreshPanel(); };
  if (f.size > BG_MAX_BYTES) return say(`这张图有 ${fmtBytes(f.size)}，太大啦，请选 8 MB 以内的`);
  const kind = await sniffImage(f);
  if (kind === 'bad') return say('这个好像不是 PNG、JPG、WebP 图片，换一张试试');
  if (kind === 'anim') return say('动图不行哦，只支持静态图片');
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const longSide = Math.max(img.naturalWidth, img.naturalHeight);
    if (longSide > BG_MAX_SIDE){
      URL.revokeObjectURL(url);
      return say('这张图分辨率太高了，长边超过 8000 像素，先缩小再试');
    }
    // 背景固定铺满，长图会被裁掉大半，直接拒绝
    if (img.naturalHeight / img.naturalWidth > 2.4){
      URL.revokeObjectURL(url);
      return say('背景是固定铺满的，长图只能看到中间一小块，换一张横图或方图吧');
    }
    if (pendingBg) URL.revokeObjectURL(pendingBg.src);
    pendingBg = img;
    const ok = commitBg(coverT(img));
    URL.revokeObjectURL(url);
    say(bgDoneText(ok));
  };
  img.onerror = () => { URL.revokeObjectURL(url); say('这张图我打不开呢，换一张试试'); };
  img.src = url;
});
bgInput.addEventListener('cancel', () => { addMsg('arona', '没选图也没关系，想换的时候再叫我'); refreshPanel(); });

function coverT(img){
  const vw = innerWidth, vh = innerHeight, s = Math.max(vw / img.naturalWidth, vh / img.naturalHeight);
  return { s, tx: (vw - img.naturalWidth * s) / 2, ty: (vh - img.naturalHeight * s) / 2, vw, vh };
}
function renderBg(img, t){
  const W = Math.min(1080, Math.round(t.vw * Math.min(devicePixelRatio || 1, 3))), H = Math.round(W * t.vh / t.vw);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, -t.tx / t.s, -t.ty / t.s, t.vw / t.s, t.vh / t.s, 0, 0, W, H);
  let q = .86, out = cv.toDataURL('image/jpeg', q);
  while (out.length > 2.4e6 && q > .5){ q -= .12; out = cv.toDataURL('image/jpeg', q); }
  return out;
}
function commitBg(t){
  try{
    const data = renderBg(pendingBg, t);
    currentBgData = data;
    saveLargeBackground(data).then(ok => {
      if (ok){ try{ localStorage.removeItem('momotalk_custom_bg'); }catch(_){} }
      else { try{ localStorage.setItem('momotalk_custom_bg', data); }catch(_){} }
    });
    setBgStyle(data);
    URL.revokeObjectURL(pendingBg.src); pendingBg = null;
    return true;
  }catch(_){ return false; }
}
const bgDoneText = ok => ok
  ? '换好啦～为了字看得清，界面先切成简约黑白，恢复默认背景就会变回原主题'
  : '这张图存不下，浏览器空间不够，换一张小一点的试试';
function bgDecide(label, mode){
  if (mode === 'cancel'){
    URL.revokeObjectURL(pendingBg.src); pendingBg = null;
    return aronaSay(label, '好，那就先保持现在的样子');
  }
  if (mode === 'apply') return aronaSay(label, () => bgDoneText(commitBg(coverT(pendingBg))));
  closePanel();
  addMsg('user', label);
  openCrop(pendingBg, t => {
    if (!t){ addMsg('arona', '没关系，要不要换个方式'); refreshPanel(); return; }
    addMsg('arona', bgDoneText(commitBg(t))); refreshPanel();
  });
}
/* 选了图之后，面板顶部会出现三种用法 */
function pendingBgOptions(){
  return [
    optBtn('直接铺满', () => bgDecide('就这样铺满吧', 'apply')),
    optBtn('裁剪再用', () => bgDecide('我想裁一下再用', 'crop')),
    optBtn('先不换了', () => bgDecide('先不换了', 'cancel'), 'muted')
  ];
}

/* ---- 裁剪层 ---- */
function paintCrop(){
  const w = cr.img.naturalWidth * cr.s, h = cr.img.naturalHeight * cr.s;
  cr.tx = Math.min(0, Math.max(cr.vw - w, cr.tx));
  cr.ty = Math.min(0, Math.max(cr.vh - h, cr.ty));
  cropImg.style.transform = `translate(${cr.tx}px,${cr.ty}px) scale(${cr.s})`;
}
function openCrop(img, done){
  const t = coverT(img);
  cr = { img, done, ...t, min: t.s, pts: new Map(), pd: 0, pc: null };
  cropImg.src = img.src;
  cropImg.style.width = img.naturalWidth + 'px'; cropImg.style.height = img.naturalHeight + 'px';
  cropUI.hidden = false;
  paintCrop();
  cropUI.querySelector('#cropOk').focus({ preventScroll:true });
}
function closeCrop(t){
  const fn = cr && cr.done; cr = null;
  cropUI.hidden = true; cropImg.removeAttribute('src');
  if (fn) fn(t);
}
function pinchInit(){
  const v = [...cr.pts.values()];
  if (v.length < 2){ cr.pd = 0; return; }
  cr.pd = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
  cr.pc = { x:(v[0].x + v[1].x) / 2, y:(v[0].y + v[1].y) / 2 };
}
function zoomAt(c, ns, to){
  ns = Math.min(cr.min * 6, Math.max(cr.min, ns));
  const ix = (c.x - cr.tx) / cr.s, iy = (c.y - cr.ty) / cr.s;
  cr.s = ns; cr.tx = to.x - ix * ns; cr.ty = to.y - iy * ns;
}
cropStage.addEventListener('pointerdown', e => {
  if (!cr) return;
  try{ cropStage.setPointerCapture(e.pointerId); }catch(_){}
  cr.pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  pinchInit();
});
cropStage.addEventListener('pointermove', e => {
  if (!cr) return;
  const p = cr.pts.get(e.pointerId);
  if (!p) return;
  const ox = p.x, oy = p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (cr.pts.size === 1){ cr.tx += p.x - ox; cr.ty += p.y - oy; }
  else if (cr.pts.size === 2){
    const v = [...cr.pts.values()];
    const d = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
    const c = { x:(v[0].x + v[1].x) / 2, y:(v[0].y + v[1].y) / 2 };
    zoomAt(cr.pc, cr.s * d / cr.pd, c);
    cr.pd = d; cr.pc = c;
  }
  paintCrop();
});
['pointerup', 'pointercancel'].forEach(ev => cropStage.addEventListener(ev, e => {
  if (!cr) return;
  cr.pts.delete(e.pointerId); pinchInit();
}));
cropStage.addEventListener('wheel', e => {
  if (!cr) return;
  e.preventDefault();
  const c = { x:e.clientX, y:e.clientY };
  zoomAt(c, cr.s * Math.exp(-e.deltaY * .0015), c);
  paintCrop();
}, { passive:false });
document.getElementById('cropCancel').onclick = () => closeCrop(null);
document.getElementById('cropOk').onclick = () => { const t = { s:cr.s, tx:cr.tx, ty:cr.ty, vw:cr.vw, vh:cr.vh }; closeCrop(t); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !cropUI.hidden) closeCrop(null); });

/* ===================== 主题模式与 IndexedDB ===================== */
function getThemeMode(){
  const v = localStorage.getItem(THEME_MODE_KEY);
  return ['light','dark','system'].includes(v) ? v : 'system';
}
function applyThemeMode(mode){
  if (!['light','dark','system'].includes(mode)) mode = 'system';
  if (mode === 'system') document.body.removeAttribute('data-theme-mode');
  else document.body.dataset.themeMode = mode;
  updateBrowserThemeColor();
}
let themeFadeTimer = null;
function runWithThemeFade(fn){
  const fade = document.getElementById('themeFade');
  const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fade || reduce){ fn(); return; }
  fade.classList.add('on');
  clearTimeout(themeFadeTimer);
  themeFadeTimer = setTimeout(() => {
    fn();
    setTimeout(() => fade.classList.remove('on'), 60);
  }, 120);
}
function setThemeMode(mode){
  try{ localStorage.setItem(THEME_MODE_KEY, mode); }catch(_){}
  runWithThemeFade(() => applyThemeMode(mode));
}
function isMomo(){ return localStorage.getItem(MOMO_KEY) === 'true'; }
function toggleMomo(){
  const next = !isMomo();
  try{ localStorage.setItem(MOMO_KEY, next ? 'true' : 'false'); }catch(_){}
  runWithThemeFade(() => {
    applyMomoTheme();
    updateBrowserThemeColor();
  });
}
applyThemeMode(getThemeMode());

const ToolboxDB={
  db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('浏览器不支持 IndexedDB'));return;}const req=indexedDB.open('ShittimToolboxDB',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('largeData'))db.createObjectStore('largeData');};req.onsuccess=()=>{this.db=req.result;resolve(this.db);};req.onerror=()=>reject(req.error||new Error('数据库打开失败'));});},
  async put(key,value){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction('largeData','readwrite');tx.objectStore('largeData').put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});},
  async get(key){const db=await this.open();return new Promise((resolve,reject)=>{const req=db.transaction('largeData','readonly').objectStore('largeData').get(key);req.onsuccess=()=>resolve(req.result??null);req.onerror=()=>reject(req.error);});},
  async remove(key){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction('largeData','readwrite');tx.objectStore('largeData').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
};
let currentBgData=null;
async function saveLargeBackground(data){try{if(data)await ToolboxDB.put('customBackground',data);else await ToolboxDB.remove('customBackground');return true;}catch(e){return false;}}
(async()=>{try{const saved=await ToolboxDB.get('customBackground');if(saved){currentBgData=saved;setBgStyle(saved);}else{const legacy=localStorage.getItem('momotalk_custom_bg');if(legacy){currentBgData=legacy;setBgStyle(legacy);await saveLargeBackground(legacy);try{localStorage.removeItem('momotalk_custom_bg');}catch(_){}}}}catch(_){const legacy=localStorage.getItem('momotalk_custom_bg');if(legacy){currentBgData=legacy;setBgStyle(legacy);}}})();

/* ===================== 备份 ===================== */
function exportBackup(){
  const keys = [MOMO_KEY, THEME_MODE_KEY, K.history, K.stage, K.unlocked, K.visited];
  try{
    const payload = { format:'shittim-toolbox-backup', version:3, exportedAt:new Date().toISOString(), data:{} };
    keys.forEach(k => { const v = localStorage.getItem(k); if (v !== null) payload.data[k] = v; });
    const bg = currentBgData || localStorage.getItem('momotalk_custom_bg');
    if (bg) payload.data.customBackground = bg;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'shittim-toolbox-backup.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setPanelStatus('备份文件已生成', true);
    return true;
  }catch(e){ setPanelStatus('备份失败：' + (e.message || '本地数据无法读取')); return false; }
}
importFile.addEventListener('change', () => {
  const file = importFile.files && importFile.files[0];
  importFile.value = '';
  if (!file) return;
  if (file.size > 12 * 1024 * 1024){ setPanelStatus('导入失败：备份文件不能超过 12 MB'); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const backup = JSON.parse(String(reader.result));
      if (!backup || backup.format !== 'shittim-toolbox-backup' || !backup.data || typeof backup.data !== 'object')
        throw new Error('备份文件格式不正确');
      for (const [key, value] of Object.entries(backup.data)){
        if (key === 'customBackground' && typeof value === 'string' && value.length <= 12 * 1024 * 1024){
          currentBgData = value;
          const stored = await saveLargeBackground(value);
          if (!stored){ try{ localStorage.setItem('momotalk_custom_bg', value); }catch(_){ throw new Error('本地空间不足，背景未能保存'); } }
          continue;
        }
        if (typeof value !== 'string' || value.length > 12 * 1024 * 1024) continue;
        localStorage.setItem(key, value);
      }
      if (Object.prototype.hasOwnProperty.call(backup.data, 'customBackground')) setBgStyle(currentBgData);
      loadChatHistory();
      renderChat();
      applyMomoTheme();
      applyThemeMode(getThemeMode());
      initEggState();
      updateBrowserThemeColor();
      renderPanel();
      setPanelStatus('导入成功，设置与对话已恢复', true);
    }catch(err){ setPanelStatus('导入失败：' + (err.message || '文件无法读取')); }
  };
  reader.onerror = () => setPanelStatus('导入失败：无法读取文件');
  reader.readAsText(file);
});

/* ===================== 首次访问：顶部消息通知 ===================== */
const visitToast = document.getElementById('visitToast');
let visitTimer = null;

function showVisitToast(){
  if (!visitToast || localStorage.getItem(K.visited) === 'true') return;
  try{ localStorage.setItem(K.visited, 'true'); }catch(_){}
  visitToast.classList.remove('show');
  void visitToast.offsetHeight;
  visitToast.classList.add('show');
  visitTimer = setTimeout(hideVisitToast, 6400);
}
function hideVisitToast(){
  clearTimeout(visitTimer);
  if (visitToast) visitToast.classList.remove('show');
}
document.addEventListener('pointerdown', e => {
  if (visitToast && visitToast.classList.contains('show') && !visitToast.contains(e.target)) hideVisitToast();
});
if (visitToast){
  visitToast.addEventListener('click', () => {
    hideVisitToast();
    openChat();
  });
}

/* ===================== 打开 / 关闭对话 ===================== */
function seedGreeting(){
  addMsg('arona', '老师，能听到吗～这里是阿罗娜，什亭之匣的主操作系统');
  setTimeout(() => addMsg('plana', '连接确认完毕，我是普拉娜，负责协助与核对'), 900);
  setTimeout(() => { refreshPanel(); initEggState(); }, 1100);
}
function openChat(){
  if (typeof hideVisitToast === 'function') hideVisitToast();
  clearTyping();
  chatUI.inert = false;
  chatUI.classList.add('show');
  aronaEntry.classList.remove('unread');
  if (!chatHistory.length) seedGreeting();
  else renderChat();
  refreshPanel();
}
function closeChat(){
  closePanel();
  chatUI.classList.remove('show');
  chatUI.inert = true;
  aronaEntry.focus({ preventScroll:true });
}
aronaEntry.addEventListener('click', openChat);
aronaEntry.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openChat(); }
});
chatBack.addEventListener('click', closeChat);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (presetSheet.classList.contains('show')){ closePanel(); return; }
  if (!cropUI.hidden) return;
  if (chatUI.classList.contains('show')) closeChat();
});

/* 首次进入：弹一条消息 */
if (localStorage.getItem(K.visited) !== 'true') setTimeout(showVisitToast, 700);
